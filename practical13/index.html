<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practical 13 - Event Management API</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background-color: #f1f5f9;
      color: #334155;
    }
    .container {
      max-width: 850px;
      margin: auto;
    }
    .card {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      margin-bottom: 25px;
    }
    h2 {
      margin-top: 0;
      color: #1e293b;
    }
    .form-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }
    input {
      flex: 1;
      min-width: 180px;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      font-size: 14px;
    }
    button {
      padding: 9px 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn-submit { background-color: #2563eb; color: #fff; }
    .btn-submit:hover { background-color: #1d4ed8; }
    .btn-cancel { background-color: #64748b; color: #fff; display: none; }
    .btn-edit { background-color: #0284c7; color: #fff; margin-right: 5px; padding: 6px 10px; }
    .btn-delete { background-color: #ef4444; color: #fff; padding: 6px 10px; }
    
    /* Loading and Status Banner */
    #status-banner {
      display: none;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      font-size: 14px;
    }
    .banner-success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .banner-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .banner-loading { background: #e0f2fe; color: #075985; border: 1px solid #bae6fd; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #e2e8f0;
    }
    th {
      background-color: #f8fafc;
      color: #475569;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="status-banner"></div>

    <!-- Form Section -->
    <div class="card">
      <h2 id="form-heading">Add New Event</h2>
      <form id="event-form">
        <input type="hidden" id="event-id">
        <div class="form-group">
          <input type="text" id="title" placeholder="Event Title (e.g., CodeCamp)" required>
          <input type="text" id="venue" placeholder="Venue (e.g., Seminar Hall)" required>
          <input type="date" id="event_date" required>
        </div>
        <button type="submit" id="save-btn" class="btn-submit">Add Event</button>
        <button type="button" id="cancel-btn" class="btn-cancel">Cancel</button>
      </form>
    </div>

    <!-- Table Section -->
    <div class="card">
      <h2>Registered Events</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Event Title</th>
            <th>Venue</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="events-tbody">
          <tr><td colspan="5">Loading events...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
